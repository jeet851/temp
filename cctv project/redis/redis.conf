# ============================================
# VisionGuard Redis — Production Configuration
# ============================================

# Network binding
bind 0.0.0.0
port 6379

# Authentication (Zero Trust Security)
requirepass redis_production_pass_2026

# Persistence Configuration
# 1. RDB (Snapshotting)
save 900 1
save 300 10
save 60 10000

# 2. AOF (Append Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# TCP Keepalive & Backlog
tcp-keepalive 300
tcp-backlog 511

# Protected mode
protected-mode yes
