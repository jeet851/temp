server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Enable Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/xml image/svg+xml;

    # Single Page Application Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable 1-year cache for production bundled assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Hide Nginx version & disable autoindex
    autoindex off;
    server_tokens off;
}
